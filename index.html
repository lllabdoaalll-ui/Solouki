<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلوكي | تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <!-- بطاقة تسجيل الدخول -->
    <div class="auth-card" id="loginCard">
      <div class="brand">
        <div class="brand-logo">س</div>
        <h1>سلوكي</h1>
        <p class="brand-tagline">نبني معاً سلوكاً أفضل</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="example@school.com" required dir="ltr">
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" required dir="ltr">
            <button type="button" class="toggle-password" id="togglePassword" title="إظهار/إخفاء">👁</button>
          </div>
        </div>

        <div class="error-box" id="loginError" hidden></div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <span class="btn-text">تسجيل الدخول</span>
          <span class="btn-loader" hidden></span>
        </button>
      </form>

      <p class="auth-switch"><button type="button" class="link-btn" id="goGuardian">دخول ولي الأمر (رقم قومي + كود الطالب)</button></p>
      <p class="auth-footer">نظام إدارة السلوك والانضباط المدرسي<br>وفق القرار الوزاري 150/2024</p>
    </div>


    <!-- دخول ولي الأمر: رقم قومي + كود الطالب -->
    <div class="auth-card" id="guardianCard" hidden>
      <div class="brand">
        <div class="brand-logo">س</div>
        <h1>ولي الأمر</h1>
        <p class="brand-tagline">الدخول برقم ابنك القومي وكود الطالب</p>
      </div>
      <form id="guardianForm">
        <div class="form-group">
          <label for="gNational">الرقم القومي للطالب</label>
          <input type="text" id="gNational" maxlength="14" inputmode="numeric" pattern="[0-9]{14}" placeholder="14 رقمًا" required dir="ltr">
        </div>
        <div class="form-group">
          <label for="gCode">كود الطالب</label>
          <input type="text" id="gCode" placeholder="كما في كشف المدرسة" required dir="ltr">
        </div>
        <div class="error-box" id="guardianError" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" id="guardianBtn">
          <span class="btn-text">دخول</span>
        </button>
        <button type="button" class="btn btn-outline btn-block mt-12" id="backToStaff">العودة لدخول الطاقم</button>
      </form>
    </div>

    <!-- بطاقة إدخال PIN (ملغاة لدخول الطاقم — كلمة المرور فقط) -->
    <div class="auth-card" id="pinCard" hidden style="display:none!important">
      <div class="brand">
        <div class="brand-logo">س</div>
        <h1>تأكيد الهوية</h1>
        <p class="brand-tagline">أدخل الرمز السري (PIN)</p>
      </div>

      <div class="user-info" id="userInfo">
        <!-- يُملأ ديناميكياً -->
      </div>

      <form id="pinForm">
        <div class="form-group">
          <label for="pin">الرمز السري</label>
          <input type="password" id="pin" name="pin" maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="••••••" required dir="ltr" class="pin-input">
        </div>

        <div class="error-box" id="pinError" hidden></div>

        <button type="submit" class="btn btn-primary btn-block" id="pinBtn">
          <span class="btn-text">تأكيد</span>
          <span class="btn-loader" hidden></span>
        </button>

        <button type="button" class="btn btn-outline btn-block mt-12" id="logoutBtn">
          تسجيل الخروج
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلوكي | ملف سلوك الطالب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/violations.css">
  <link rel="stylesheet" href="css/student-report.css">
</head>
<body class="catalog-page">
  <header class="catalog-header">
    <div class="catalog-header-inner">
      <div>
        <p class="section-kicker">نظام سلوكي لإدارة السلوك والانضباط المدرسي</p>
        <h1>ملف سلوك الطالب</h1>
        <p class="subtitle">عرض المخالفات والإحصائيات وتجهيز إشعار ولي الأمر</p>
      </div>
      <div class="header-actions">
        <a class="btn btn-outline" href="dashboard.html">لوحة التحكم</a>
        <a class="btn btn-outline" href="violations.html">تسجيل مخالفة</a>
        <button type="button" class="btn btn-outline" id="logout">خروج</button>
      </div>
    </div>
  </header>

  <main class="catalog-main">
    <div id="ok" class="note note-ok" hidden></div>
    <div id="error" class="note note-error" hidden></div>

    <section class="panel active">
      <div class="panel-head">
        <div>
          <span class="section-kicker">بحث</span>
          <h2>اختر الطالب</h2>
        </div>
      </div>
      <div class="record-form">
        <div class="form-block">
          <label for="studentSearch">اسم / رقم قومي / رقم جلوس</label>
          <input id="studentSearch" type="search" placeholder="حرفان على الأقل…" autocomplete="off">
          <div id="studentResults" class="search-results" hidden></div>
        </div>
      </div>
    </section>

    <section class="panel active" id="reportSection" hidden>
      <div class="panel-head no-print">
        <div>
          <span class="section-kicker">التقرير</span>
          <h2 id="reportTitle">ملف السلوك</h2>
        </div>
        <div class="header-actions">
          <button type="button" class="btn btn-outline" id="printBtn">🖨️ طباعة</button>
          <button type="button" class="btn btn-outline" id="clearReportBtn">طالب آخر</button>
        </div>
      </div>

      <div id="studentCard" class="student-card"></div>

      <div class="stats-grid" id="statsGrid"></div>

      <div class="report-table-wrap">
        <h3 class="section-sub">سجل المخالفات</h3>
        <div id="recordsTable" class="table-wrap"></div>
      </div>

      <div class="wa-box no-print" id="waBox">
        <h3 class="section-sub">إشعار ولي الأمر عبر واتساب</h3>
        <p class="field-hint">يفتح واتساب الشخصي برسالة جاهزة (نفس أسلوب صفحة الإشعارات).</p>
        <div class="wa-phones" id="waPhones"></div>
        <label for="waMessage">نص الرسالة</label>
        <textarea id="waMessage" rows="6"></textarea>
        <div class="form-actions" style="margin-top:12px">
          <button type="button" class="btn btn-primary" id="waFatherBtn" disabled>واتساب الأب</button>
          <button type="button" class="btn btn-primary" id="waMotherBtn" disabled>واتساب الأم</button>
          <button type="button" class="btn btn-outline" id="waCopyBtn">نسخ الرسالة</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/permissions.js"></script>
  <script src="js/student-report.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4f3c"/>
      <stop offset="50%" stop-color="#0b5e42"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <!-- Subtle top highlight for 3D -->
  <rect width="192" height="60" rx="42" fill="url(#bgGrad)" opacity="0.3"/>
  <path d="M0 42 Q96 10 192 42 L192 0 Q96 -20 0 0 Z" fill="#ffffff" opacity="0.08"/>
  
  <!-- Trophy left -->
  <g filter="url(#shadow)" transform="translate(18, 95)">
    <path d="M12 0 h20 c4 0 6 3 6 6 v8 c0 8 -6 14 -16 18 -10 -4 -16 -10 -16 -18 v-8 c0 -3 2 -6 6 -6z" fill="url(#trophyGrad)"/>
    <rect x="16" y="32" width="12" height="6" rx="1" fill="#b45309"/>
    <rect x="12" y="38" width="20" height="4" rx="1" fill="#92400e"/>
    <circle cx="22" cy="12" r="5" fill="#fef3c7" opacity="0.9"/>
  </g>
  
  <!-- Main shield -->
  <g filter="url(#shadow)" transform="translate(56, 28)">
    <path d="M40 0 L80 12 V48 C80 72 60 88 40 96 C20 88 0 72 0 48 V12 Z" fill="url(#shieldGrad)"/>
    <path d="M40 6 L72 16 V48 C72 68 54 82 40 88 C26 82 8 68 8 48 V16 Z" fill="#ffffff" opacity="0.15"/>
    <!-- Person silhouette -->
    <circle cx="40" cy="36" r="14" fill="#ffffff"/>
    <path d="M18 68 C22 52 30 46 40 46 S58 52 62 68" fill="#ffffff"/>
    <!-- Shine lines -->
    <path d="M28 28 L32 24 M48 24 L52 28" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Check badge -->
  <g filter="url(#shadow)" transform="translate(128, 108)">
    <circle cx="22" cy="22" r="20" fill="url(#checkGrad)"/>
    <circle cx="22" cy="22" r="16" fill="#ffffff" opacity="0.2"/>
    <path d="M12 22 L19 29 L34 14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Solouki -->
  <text x="96" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" filter="url(#shadow)">Solouki</text>
  <!-- Leaf accent -->
  <path d="M148 158 Q156 148 164 158 Q156 164 148 158" fill="#6ee7b7" opacity="0.9"/>
</svg>

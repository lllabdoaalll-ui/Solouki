<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c56">
  <title>سلوكي | تغيير كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-shell" style="grid-template-columns:1fr;max-width:480px;margin:0 auto">
    <div class="auth-panel" style="width:100%">
      <div class="auth-panel-inner">
        <div class="auth-card">
          <div class="brand">
            <div class="brand-logo">س</div>
            <h1 id="cpTitle">تغيير كلمة المرور</h1>
            <p class="brand-tagline" id="cpSubtitle">
              لأسباب أمنية، يجب تغيير كلمة المرور قبل المتابعة.
            </p>
          </div>

          <form id="cpForm">
            <div class="form-group">
              <label for="oldPass">كلمة المرور الحالية</label>
              <input type="password" id="oldPass" dir="ltr" required autocomplete="current-password">
            </div>
            <div class="form-group">
              <label for="newPass">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
              <input type="password" id="newPass" dir="ltr" minlength="8" required autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="confirmPass">تأكيد كلمة المرور</label>
              <input type="password" id="confirmPass" dir="ltr" minlength="8" required autocomplete="new-password">
            </div>
            <div class="error-box" id="cpError" hidden></div>
            <div class="success-box" id="cpSuccess" hidden></div>
            <button type="submit" class="btn btn-primary btn-block">حفظ</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script>
    (async function () {
      const sb = window.SoloukiDB ? SoloukiDB.sb() : window.supabase.createClient(
        window.SOLOUKI_CONFIG.SUPABASE_URL,
        window.SOLOUKI_CONFIG.SUPABASE_ANON_KEY
      );

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        location.href = 'index.html';
        return;
      }

      // تخصيص العنوان إذا كان أول دخول
      const params = new URLSearchParams(location.search);
      if (params.get('first') === '1') {
        document.getElementById('cpTitle').textContent = 'تعيين كلمة المرور';
        document.getElementById('cpSubtitle').textContent =
          'هذه أول مرة تدخل فيها. يرجى تعيين كلمة مرور خاصة بك قبل المتابعة.';
      }

      document.getElementById('cpForm').onsubmit = async (e) => {
        e.preventDefault();
        const oldP = document.getElementById('oldPass').value;
        const n1 = document.getElementById('newPass').value;
        const n2 = document.getElementById('confirmPass').value;
        const err = document.getElementById('cpError');
        const ok  = document.getElementById('cpSuccess');
        err.hidden = true;
        ok.hidden = true;

        if (n1.length < 8) {
          err.textContent = 'كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل';
          err.hidden = false;
          return;
        }
        if (n1 !== n2) {
          err.textContent = 'كلمتا المرور غير متطابقتين';
          err.hidden = false;
          return;
        }
        if (n1 === oldP) {
          err.textContent = 'كلمة المرور الجديدة مطابقة للحالية';
          err.hidden = false;
          return;
        }

        // التحقق من كلمة المرور الحالية
        const email = session.user.email;
        const { error: reErr } = await sb.auth.signInWithPassword({ email, password: oldP });
        if (reErr) {
          err.textContent = 'كلمة المرور الحالية غير صحيحة';
          err.hidden = false;
          return;
        }

        // تحديث كلمة المرور
        const { error: upErr } = await sb.auth.updateUser({ password: n1 });
        if (upErr) {
          err.textContent = upErr.message;
          err.hidden = false;
          return;
        }

        // إزالة إلزام التغيير
        try {
          await sb.rpc('mark_password_changed');
        } catch (_) { /* ignore */ }

        ok.textContent = 'تم التغيير بنجاح. جاري توجيهك...';
        ok.hidden = false;
        sessionStorage.removeItem('solouki_force_change_pwd');
        setTimeout(() => location.href = 'dashboard.html', 1200);
      };
    })();
  </script>
</body>
</html>

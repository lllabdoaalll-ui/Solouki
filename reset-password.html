<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c56">
  <title>سلوكي | إعادة تعيين كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-shell" style="grid-template-columns:1fr;max-width:480px;margin:0 auto">
    <div class="auth-panel" style="width:100%">
      <div class="auth-panel-inner">
        <div class="auth-card">
          <div class="brand">
            <div class="brand-logo">س</div>
            <h1>إعادة تعيين كلمة المرور</h1>
            <p class="brand-tagline">أدخل كلمة المرور الجديدة</p>
          </div>

          <form id="resetForm">
            <div class="form-group">
              <label for="newPass">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
              <input type="password" id="newPass" dir="ltr"
                     minlength="8" required autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="confirmPass">تأكيد كلمة المرور</label>
              <input type="password" id="confirmPass" dir="ltr"
                     minlength="8" required autocomplete="new-password">
            </div>
            <div class="error-box" id="resetError" hidden></div>
            <div class="success-box" id="resetSuccess" hidden></div>
            <button type="submit" class="btn btn-primary btn-block">حفظ كلمة المرور</button>
          </form>

          <p class="auth-footer">
            <a href="index.html" style="color:#0f5c56;font-weight:600">العودة لتسجيل الدخول</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script>
    (async function () {
      const sb = window.SoloukiDB ? SoloukiDB.sb() : window.supabase.createClient(
        window.SOLOUKI_CONFIG.SUPABASE_URL,
        window.SOLOUKI_CONFIG.SUPABASE_ANON_KEY
      );

      // Supabase يضع التوكن في hash الـ URL عند العودة من البريد
      const { data: { session }, error: sessionError } = await sb.auth.getSession();

      if (!session) {
        // محاولة استرجاع الجلسة من الـ hash (في حال لم تُعالج تلقائياً)
        const hash = window.location.hash;
        if (hash && hash.includes('access_token')) {
          // supabase-js يتعامل معها تلقائياً عادةً
          await new Promise(r => setTimeout(r, 500));
          const retry = await sb.auth.getSession();
          if (!retry.data.session) {
            showError('الرابط غير صالح أو منتهي الصلاحية. اطلب رابطاً جديداً.');
            return;
          }
        } else {
          showError('الرابط غير صالح أو منتهي الصلاحية. اطلب رابطاً جديداً.');
          return;
        }
      }

      document.getElementById('resetForm').onsubmit = async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('newPass').value;
        const p2 = document.getElementById('confirmPass').value;
        const err = document.getElementById('resetError');
        const ok  = document.getElementById('resetSuccess');
        err.hidden = true;
        ok.hidden = true;

        if (p1.length < 8) {
          err.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
          err.hidden = false;
          return;
        }
        if (p1 !== p2) {
          err.textContent = 'كلمتا المرور غير متطابقتين';
          err.hidden = false;
          return;
        }

        const { error } = await sb.auth.updateUser({ password: p1 });
        if (error) {
          err.textContent = error.message;
          err.hidden = false;
          return;
        }

        // علّم النظام أن كلمة المرور تغيّرت
        try {
          await sb.rpc('mark_password_changed');
        } catch (_) { /* ignore if function not yet available */ }

        ok.textContent = 'تم تعيين كلمة المرور بنجاح. سيتم توجيهك للدخول...';
        ok.hidden = false;
        setTimeout(() => location.href = 'index.html', 1800);
      };

      function showError(msg) {
        const el = document.getElementById('resetError');
        el.textContent = msg;
        el.hidden = false;
        document.getElementById('resetForm').querySelector('button[type="submit"]').disabled = true;
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e">
<title>سلوكي | فحص النظام</title><link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app-shell.css?v=4.67.0"><link rel="stylesheet" href="css/diagnostics.css">
</head><body class="app-page">
<main class="diagnostics-page">
  <header class="app-header no-print">
  <div class="app-header-inner">
    <a class="app-header-back" href="dashboard.html" title="لوحة التحكم" aria-label="رجوع">→</a>
    <div class="app-header-titles">
      <span class="kicker">تشخيص تشغيلي</span>
      <h1>فحص جاهزية النظام</h1>
    </div>
    <div class="app-header-actions">
      <a class="btn btn-outline" href="dashboard.html">لوحة التحكم</a>
      <button type="button" class="btn btn-outline" id="logout" data-action="logout">خروج</button>
    </div>
  </div>
</header>

  <section class="summary-card"><div><strong id="overallStatus">جاري الفحص…</strong><span id="checkedAt"></span></div><button id="runChecks" class="btn btn-primary">إعادة الفحص</button></section>
  <section id="checks" class="checks-grid" aria-live="polite"></section>
  <section class="note"><strong>ملاحظة أمنية:</strong> هذه الصفحة لا تعرض مفاتيح سرية ولا تختبر Service Role Key. نجاح الفحص لا يعني أن كل صلاحيات قاعدة البيانات صحيحة؛ التحقق النهائي يكون عبر RLS وRPC.</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
